
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Formulário Temático - Cadastro de Jogadores</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Cadastro de Jogadores</h1>
</header>

<form>
  <label for="nome">Nome completo</label>
  <input type="text" id="nome" required>

  <label for="email">E‑mail</label>
  <input type="email" id="email" required>

  <label for="idade">Idade</label>
  <input type="number" id="idade" min="1" max="120">

  <label for="nick">Nickname no jogo</label>
  <input type="text" id="nick">

  <label for="classe">Classe preferida</label>
  <select id="classe">
    <option>Mago</option>
    <option>Guerreiro</option>
    <option>Arqueiro</option>
    <option>Assassino</option>
  </select>

  <label for="data">Data de Registro</label>
  <input type="date" id="data">

  <label for="horario">Horário de treinamento</label>
  <input type="time" id="horario">

  <label for="msg">Observações</label>
  <textarea id="msg" rows="4"></textarea>

  <button type="submit">Enviar</button>
</form>

</body>
</html>
